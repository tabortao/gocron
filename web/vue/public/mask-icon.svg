<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#409eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#337ecc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 时钟外圈 -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="white" stroke-width="16"/>
  <!-- 时钟刻度 -->
  <g fill="white">
    <rect x="248" y="100" width="16" height="40" rx="4"/>
    <rect x="248" y="372" width="16" height="40" rx="4"/>
    <rect x="100" y="248" width="40" height="16" rx="4"/>
    <rect x="372" y="248" width="40" height="16" rx="4"/>
  </g>
  <!-- 时针 -->
  <rect x="248" y="160" width="16" height="110" rx="8" fill="white"/>
  <!-- 分针 -->
  <rect x="252" y="140" width="12" height="130" rx="6" fill="white" transform="rotate(90 256 256)"/>
  <!-- 中心点 -->
  <circle cx="256" cy="256" r="16" fill="white"/>
  <!-- 播放按钮（代表任务执行） -->
  <path d="M380 380 L380 440 L430 410 Z" fill="white"/>
</svg>
